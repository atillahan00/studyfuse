name: Android build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
      - 'examples/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Test, lint and build APKs
        run: >-
          ./gradlew --no-daemon --no-parallel --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          :core:test :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFuse-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyFuse-validation
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 30
