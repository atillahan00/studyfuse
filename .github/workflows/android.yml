name: Android build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
      - 'examples/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public model revisions, hashes and ranged downloads
        run: python3 scripts/verify_model_catalog.py | tee model-catalog-validation.json
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StudyFuse-model-catalog
          path: model-catalog-validation.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Test, lint and build APKs
        run: >-
          ./gradlew --no-daemon --no-parallel --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          :core:test :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFuse-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyFuse-validation
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 30

  android-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android rendering, exam recovery, OCR and AI failure isolation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g" -Pkotlin.compiler.execution.strategy=in-process :app:connectedDebugAndroidTest
      - name: Upload Android runtime results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyFuse-android-runtime
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30
